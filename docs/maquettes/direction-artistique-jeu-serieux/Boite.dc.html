<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>La boîte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.board{width:470px;height:960px;box-sizing:border-box;padding:40px;background:#d9ddd9}
.cap{margin:0 0 12px 8px;font:600 14px 'Barlow',sans-serif;color:#33403e}
.nuit{--fond:#071318;--eau1:#0d242b;--ligne:#cfe3e0;--fin:rgba(160,210,205,.24);--texte:#e3efec;--texte2:#93aaa7;--accent:#f0a24b;--suraccent:#071318;--accentvif:#f0a24b;--panneau:#0f262d;--ok:#5fd3a0}
.ecran{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;border:1px solid rgba(0,0,0,.2);color:var(--texte);background:var(--fond);box-sizing:border-box;padding:52px 20px 0;display:flex;flex-direction:column;gap:16px}
.c{font-family:'Barlow Condensed','Barlow',sans-serif;margin:0}
.lbl{font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--texte2);margin:0}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pic{fill:none;stroke:var(--ligne);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.rond{width:48px;height:48px;box-sizing:border-box;border-radius:24px;background:transparent;color:var(--texte);border:1.5px solid var(--fin);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none}
.filtre{height:48px;flex:none;padding:0 2px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--texte2);font:600 15px 'Barlow',sans-serif;cursor:pointer}
.filtre.on{color:var(--texte);border-bottom-color:var(--accent)}
.tuile{position:relative;box-sizing:border-box;min-height:136px;border-radius:16px;border:1px solid var(--fin);background:var(--panneau);padding:12px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;color:var(--texte);text-decoration:none}
</style>
</helmet>
<div class="board">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="p-souples" viewBox="0 0 64 64"><circle cx="13" cy="30" r="5" style="fill:var(--accentvif);stroke:none"/><path d="M11 35c-1 7 4 11 10 8"/><path d="M19 27l19-3 12-8v28l-12-8-19-3z"/><path d="M27 27v7M33 26v9"/></symbol>
<symbol id="p-durs" viewBox="0 0 64 64"><ellipse cx="35" cy="29" rx="19" ry="9"/><path d="M17 33L9 40"/><circle cx="25" cy="27" r="2" style="fill:var(--accentvif);stroke:none"/><path d="M30 21c-3 5-3 11 0 16"/><path d="M33 38v7a3 3 0 0 1-6 0M47 36v7a3 3 0 0 0 6 0"/></symbol>
<symbol id="p-surface" viewBox="0 0 64 64"><path d="M14 21h30q9 0 9 6t-9 6H14q5-6 0-12z"/><circle cx="42" cy="26" r="2" style="fill:var(--accentvif);stroke:none"/><path d="M6 41q5-4 10 0t10 0 10 0 10 0 10 0"/><path d="M16 49q4-3 8 0t8 0 8 0"/></symbol>
<symbol id="p-metal" viewBox="0 0 64 64"><path d="M10 38h30"/><circle cx="7" cy="38" r="3"/><ellipse cx="25" cy="27" rx="12" ry="6.5" transform="rotate(-18 25 27)" style="fill:var(--accentvif)"/><path d="M23 38l1-5"/><ellipse cx="45" cy="38" rx="5" ry="4"/><path d="M50 38h3q7 0 7 8M60 46q-3 4-6 1"/></symbol>
<symbol id="p-jupe" viewBox="0 0 64 64"><circle cx="16" cy="29" r="6" style="fill:var(--accentvif)"/><circle cx="16" cy="14" r="2.5"/><path d="M16 16.5V23"/><path d="M22 29c10-7 20-9 32-9M22 29c12-2 24-2 34-1M22 29c12 3 24 5 34 6M22 29c10 6 20 13 30 15"/><path d="M21 24v10"/><path d="M13 34c0 8 4 11 9 11"/></symbol>
<symbol id="i-retour" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
</svg>

<p class="cap">La boîte · thème sombre</p>
<div class="ecran nuit">

<div style="display:flex;align-items:center;gap:12px">
<a class="rond" href="Main.dc.html" aria-label="Retour à la rivière"><svg class="ic"><use href="#i-retour"/></svg></a>
<div style="flex:1"><h1 class="c" style="font-size:30px;line-height:32px;font-weight:700">Ma boîte</h1><p class="lbl">6 leurres</p></div>
<button style="height:48px;box-sizing:border-box;border-radius:14px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);display:flex;align-items:center;gap:6px;padding:0 14px;font:700 15px 'Barlow',sans-serif;cursor:pointer"><svg class="ic"><use href="#i-plus"/></svg>Ajouter</button>
</div>

<div role="tablist" aria-label="Familles" style="display:flex;gap:18px;border-bottom:1px solid var(--fin);margin:0 -20px;padding:0 20px;overflow:hidden">
<sc-for list="{{filtres}}" as="f" hint-placeholder-count="6">
<button class="filtre {{f.cls}}" role="tab">{{f.nom}}</button>
</sc-for>
</div>

<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
<sc-for list="{{leurres}}" as="l" hint-placeholder-count="6">
<a class="tuile" href="Combo.dc.html">
<sc-if value="{{l.rang}}" hint-placeholder-val="{{false}}"><span class="c" style="position:absolute;right:10px;top:8px;font-size:18px;font-weight:700;color:var(--accent)">{{l.rang}}</span></sc-if>
<svg class="pic" width="52" height="52"><use href="{{l.pic}}"/></svg>
<span style="font:700 15px/19px 'Barlow',sans-serif">{{l.nom}}</span>
<span class="lbl" style="font-size:11.5px">{{l.famille}}</span>
</a>
</sc-for>
</div>
<p style="margin:-6px 0 0;font:500 13px/18px 'Barlow',sans-serif;color:var(--texte2)"><span style="color:var(--accent);font-weight:700">01 02 03</span> : conseillés en ce moment.</p>

<a href="#" style="display:flex;align-items:center;gap:10px;min-height:56px;border-top:1px solid var(--fin);border-bottom:1px solid var(--fin);color:var(--texte);text-decoration:none">
<span style="flex:1"><span style="display:block;font:700 15px/20px 'Barlow',sans-serif">Kit de départ</span><span style="display:block;font:500 14px/19px 'Barlow',sans-serif;color:var(--texte2)">Il te manque 3 leurres</span></span>
<span style="font:600 15px 'Barlow',sans-serif">Compléter</span><svg class="ic"><use href="#i-chev"/></svg>
</a>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":470,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      filtres: [
        { cls: 'on', nom: 'Tous' },
        { cls: '', nom: 'Souples' },
        { cls: '', nom: 'Durs' },
        { cls: '', nom: 'Surface' },
        { cls: '', nom: 'Métalliques' },
        { cls: '', nom: 'À jupe' }
      ],
      leurres: [
        { rang: '01', pic: '#p-souples', nom: 'Shad', famille: 'Souples' },
        { rang: '02', pic: '#p-jupe', nom: 'Jig à jupe', famille: 'À jupe' },
        { rang: '03', pic: '#p-souples', nom: 'Ver souple finesse', famille: 'Souples' },
        { rang: '', pic: '#p-metal', nom: 'Cuillère tournante', famille: 'Métalliques' },
        { rang: '', pic: '#p-surface', nom: 'Popper', famille: 'Surface' },
        { rang: '', pic: '#p-durs', nom: 'Crankbait', famille: 'Durs' }
      ]
    };
  }
}
</script>
</body>
</html>
