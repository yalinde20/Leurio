<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>La rivière</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.board{width:908px;height:960px;box-sizing:border-box;padding:40px;background:#d9ddd9;display:flex;gap:48px;align-items:flex-start}
.cap{margin:0 0 12px 8px;font:600 14px 'Barlow',sans-serif;color:#33403e}
.jour{--fond:#eef3f1;--eau1:#d8e9e8;--eau2:#c6dfdf;--eau3:#b3d2d3;--lit:#93aba8;--ligne:#0f1e22;--fin:rgba(15,30,34,.22);--texte:#0f1e22;--texte2:#45585b;--accent:#c4620c;--suraccent:#0f1e22;--accentvif:#e8822e;--panneau:#fbfdfc;--ok:#1f7a55;--warn:#8a4300}
.nuit{--fond:#071318;--eau1:#0d242b;--eau2:#0b1e24;--eau3:#08171c;--lit:#2a3a3c;--ligne:#cfe3e0;--fin:rgba(160,210,205,.24);--texte:#e3efec;--texte2:#93aaa7;--accent:#f0a24b;--suraccent:#071318;--accentvif:#f0a24b;--panneau:#0f262d;--ok:#5fd3a0;--warn:#f0a24b}
.ecran{position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;border:1px solid rgba(0,0,0,.2);color:var(--texte);background:var(--fond)}
.abs{position:absolute}
.c{font-family:'Barlow Condensed','Barlow',sans-serif;margin:0}
.lbl{font:600 12px 'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--texte2)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pic{fill:none;stroke:var(--ligne);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.rond{width:48px;height:48px;box-sizing:border-box;border-radius:24px;background:transparent;color:var(--texte);border:1.5px solid var(--fin);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.dock{height:56px;box-sizing:border-box;border-radius:14px;border:1.5px solid var(--fin);background:transparent;color:var(--texte);display:flex;align-items:center;justify-content:center;gap:8px;font:600 16px 'Barlow',sans-serif;cursor:pointer;text-decoration:none}
</style>
</helmet>
<div class="board">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="p-souples" viewBox="0 0 64 64"><circle cx="13" cy="30" r="5" style="fill:var(--accentvif);stroke:none"/><path d="M11 35c-1 7 4 11 10 8"/><path d="M19 27l19-3 12-8v28l-12-8-19-3z"/><path d="M27 27v7M33 26v9"/></symbol>
<symbol id="i-boite" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2.5"/><path d="M9 8V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5V8M3 13h18"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="i-sac" viewBox="0 0 24 24"><path d="M8.5 7V5.5A2.5 2.5 0 0 1 11 3h2a2.5 2.5 0 0 1 2.5 2.5V7"/><rect x="4.5" y="7" width="15" height="14" rx="4"/><path d="M8.5 13.5h7M12 13.5v3"/></symbol>
<symbol id="i-personne" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="i-chev-bas" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="i-livre" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></symbol>
<symbol id="i-alerte" viewBox="0 0 24 24"><path d="M12 3.5l9.5 17h-19z"/><path d="M12 10v5M12 18v.2"/></symbol>
</svg>

<sc-for list="{{ecrans}}" as="p" hint-placeholder-count="2">
<div>
<p class="cap">{{p.cap}}</p>
<div class="ecran {{p.cls}}">

<svg class="abs" width="390" height="844" viewBox="0 0 390 844" style="left:0;top:0" aria-hidden="true">
<rect y="170" width="390" height="150" style="fill:var(--eau1)"/>
<rect y="320" width="390" height="160" style="fill:var(--eau2)"/>
<rect y="480" width="390" height="140" style="fill:var(--eau3)"/>
<path d="M0 170H390" style="stroke:var(--ligne);stroke-width:1.5"/>
<path d="M0 320H390M0 480H390" style="stroke:var(--fin);stroke-width:1;stroke-dasharray:3 5"/>
<path d="M0 622Q90 612 190 620T390 616V650H0Z" style="fill:var(--lit)"/>
<path d="M0 622Q90 612 190 620T390 616" style="fill:none;stroke:var(--ligne);stroke-width:1.5"/>
<path d="M90 470V538" style="stroke:var(--accent);stroke-width:1.5;stroke-dasharray:2 4"/>
<g transform="translate(90 566)"><circle r="28" style="fill:none;stroke:var(--accent);stroke-width:2"/><path d="M0-36v8M0 28v8M-36 0h8M28 0h8" style="stroke:var(--accent);stroke-width:2;stroke-linecap:round"/></g>
<g style="fill:none;stroke:var(--ligne);stroke-width:2.5;stroke-linecap:round"><path d="M232 576q20-26 40 0"/><path d="M262 566q14-18 28 0" style="opacity:.6"/></g>
</svg>

<div class="abs" style="left:20px;right:20px;top:52px;display:flex;align-items:center;gap:12px">
<button style="flex:1;min-width:0;min-height:48px;display:flex;align-items:center;gap:6px;background:transparent;border:0;padding:0;color:var(--texte);cursor:pointer;text-align:left">
<span style="min-width:0"><span class="c" style="display:block;font-size:26px;line-height:28px;font-weight:700">Pont de Cé</span><span style="display:block;font:500 14px/18px 'Barlow',sans-serif;color:var(--texte2)">Sandre · {{p.moment}}, {{p.heure}}</span></span>
<svg class="ic" style="color:var(--texte2)"><use href="#i-chev-bas"/></svg>
</button>
<button class="rond" aria-label="Compte"><svg class="ic"><use href="#i-personne"/></svg></button>
</div>

<button class="abs" style="left:20px;top:112px;height:48px;display:flex;align-items:center;gap:8px;background:transparent;border:0;padding:0;cursor:pointer;color:{{p.statutCouleur}};font:600 15px 'Barlow',sans-serif">
<svg class="ic"><use href="{{p.statutIcone}}"/></svg>{{p.statut}}<svg class="ic" style="width:16px;height:16px;color:var(--texte2)"><use href="#i-chev"/></svg>
</button>

<span class="abs lbl" style="left:20px;top:180px">Surface</span>
<span class="abs lbl" style="left:20px;top:330px">Mi-eau</span>
<span class="abs lbl" style="left:20px;top:490px">Fond</span>

<div class="abs" style="right:20px;top:184px;text-align:right">
<p class="c" style="font-size:46px;line-height:46px;font-weight:700">11,5<span style="font-size:24px"> °C</span></p>
<p style="margin:2px 0 0;font:500 13px/18px 'Barlow',sans-serif;color:var(--texte2)">Eau · Hub'Eau à 4 km</p>
<button style="margin-top:2px;min-height:44px;display:inline-flex;align-items:center;gap:4px;background:transparent;border:0;padding:0;color:var(--texte);font:600 14px 'Barlow',sans-serif;cursor:pointer">{{p.ciel}}<svg class="ic" style="width:16px;height:16px"><use href="#i-chev"/></svg></button>
</div>

<a class="abs" href="Combo.dc.html" style="left:20px;right:20px;top:352px;box-sizing:border-box;background:var(--panneau);border:1px solid var(--fin);border-radius:16px;color:var(--texte);text-decoration:none;display:flex;flex-direction:column">
<span style="display:flex;align-items:center;gap:12px;padding:12px 14px">
<span class="c" style="font-size:30px;line-height:30px;font-weight:700;color:var(--accent)">01</span>
<svg class="pic" width="40" height="40"><use href="#p-souples"/></svg>
<span style="flex:1;min-width:0"><span class="c" style="display:block;font-size:24px;line-height:26px;font-weight:700">Shad · tirée-relâchée</span><span style="display:block;font:500 14px/18px 'Barlow',sans-serif;color:var(--texte2)">8 cm · gardon · près du fond</span></span>
<svg class="ic"><use href="#i-chev"/></svg>
</span>
</a>
<a class="abs" href="#" style="left:150px;top:440px;min-height:44px;display:flex;align-items:center;gap:4px;color:var(--texte);font:600 14px 'Barlow',sans-serif;text-decoration:none">2 autres coups<svg class="ic" style="width:16px;height:16px"><use href="#i-chev"/></svg></a>

<span class="abs lbl" style="left:222px;top:530px;color:var(--texte)">Sandre · peu actif</span>

<div class="abs" style="left:0;right:0;top:650px;bottom:0;background:var(--fond);border-top:1px solid var(--fin);padding:14px 20px 0;box-sizing:border-box">
<div style="display:flex;align-items:baseline;justify-content:space-between">
<p class="c" style="font-size:20px;line-height:24px;font-weight:600">{{p.moment}} <span style="color:var(--texte2);font-weight:500">{{p.heure}}</span></p>
<a href="#" style="min-height:32px;display:flex;align-items:center;gap:2px;color:var(--texte);font:600 14px 'Barlow',sans-serif;text-decoration:none">Demain<svg class="ic" style="width:16px;height:16px"><use href="#i-chev"/></svg></a>
</div>
<div role="slider" aria-label="Moment" aria-valuetext="{{p.moment}} {{p.heure}}" style="position:relative;height:36px;margin-top:2px">
<div style="position:absolute;left:0;right:0;top:16px;height:4px;border-radius:2px;background:var(--fin)"></div>
<div style="position:absolute;left:102px;width:170px;top:16px;height:4px;border-radius:2px;background:var(--ligne)"></div>
<div style="position:absolute;top:6px;left:{{p.curseur}}px;width:24px;height:24px;box-sizing:border-box;border-radius:12px;background:var(--accent);border:3px solid var(--fond);box-shadow:0 0 0 1.5px var(--accent)"></div>
</div>
<div style="position:relative;height:16px;font:500 12px/16px 'Barlow',sans-serif;color:var(--texte2)"><span style="position:absolute;left:84px">7 h 02</span><span style="position:absolute;left:252px">18 h 39</span></div>
<div style="display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin-top:14px">
<a class="dock" href="Boite.dc.html"><svg class="ic"><use href="#i-boite"/></svg>Boîte</a>
<button class="dock" style="background:var(--accent);border-color:var(--accent);color:var(--suraccent);font-weight:700"><svg class="ic"><use href="#i-sac"/></svg>Ma sortie</button>
<a class="dock" href="Spots.dc.html"><svg class="ic"><use href="#i-pin"/></svg>Spots</a>
</div>
</div>

</div>
</div>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":908,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      ecrans: [
        { cls: 'jour', cap: 'Jour, maintenant · thème clair', moment: 'Maintenant', heure: '14 h 20', curseur: 197, ciel: 'Nuageux, vent 12 km/h', statut: 'Pêche ouverte jusqu\'à 18 h 39', statutIcone: '#i-livre', statutCouleur: 'var(--ok)' },
        { cls: 'nuit', cap: 'Ce soir · thème sombre', moment: 'Ce soir', heure: '18 h 30', curseur: 258, ciel: 'Dégagé, vent 8 km/h', statut: 'Fermeture à 18 h 39, dans 9 min', statutIcone: '#i-alerte', statutCouleur: 'var(--warn)' }
      ]
    };
  }
}
</script>
</body>
</html>
