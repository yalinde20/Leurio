# Version iOS signée envoyée sur TestFlight (US 26).
# Déclencheurs : appelé par release-please.yml à la création d'une release (une release créée avec
# GITHUB_TOKEN ne déclenche pas d'autre workflow), release publiée à la main depuis main, ou lancement manuel.
# Lint, type check et tests passent avant le build ; s'ils échouent, rien n'est envoyé.
# Secrets à créer dans le dépôt (scripts/verifier-secrets-ios.mjs nomme celui qui manque) :
# - IOS_CERTIFICATE_P12_BASE64, IOS_CERTIFICATE_PASSWORD : certificat « Apple Distribution » exporté en .p12 (encodé en base64) et son mot de passe ;
# - IOS_PROVISIONING_PROFILE_BASE64 : profil de provisionnement App Store de l'app app.leurio, encodé en base64
#   (l'identifiant d'équipe et le nom du profil en sont lus, rien d'autre à configurer) ;
# - APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID : identifiants de la clé d'API App Store Connect ;
# - APP_STORE_CONNECT_API_KEY_P8 : contenu de la clé .p8 (texte brut ou encodé en base64) ;
# - FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN, FIREBASE_PROJECT_ID, FIREBASE_STORAGE_BUCKET,
#   FIREBASE_MESSAGING_SENDER_ID, FIREBASE_APP_ID, FIREBASE_APPCHECK_SITE_KEY : configuration du build.
# Le trousseau temporaire n'est pas supprimé en fin de job : le runner macOS est détruit après l'exécution,
# et une étape de nettoyage exigerait de contourner l'échec des étapes précédentes.
name: iOS TestFlight

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Balise de la release (donne la version affichée)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-testflight:
    # Release : publiée depuis main. Lancement manuel : depuis main ou une balise, jamais une branche de travail.
    if: >-
      (github.event_name != 'release' || github.event.release.target_commitish == 'main') &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Lancement manuel : la balise choisie dans « Use workflow from », sinon version 0.0.0.
      TAG: ${{ inputs.tag || github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Historique complet : balises (version d'un lancement manuel) et vérification « depuis main ».
          fetch-depth: 0
          persist-credentials: false
      - name: Vérification des secrets
        run: node scripts/verifier-secrets-ios.mjs
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.FIREBASE_APPCHECK_SITE_KEY }}
      - name: Le commit vient de main
        # target_commitish est ignoré quand la balise existe déjà : on vérifie le commit lui-même.
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Ce commit n'est pas sur main : rien n'est envoyé aux testeurs."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installation
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Validation du contenu
        run: npm run validate-data
      - name: Build de production
        run: npm run build
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.FIREBASE_APPCHECK_SITE_KEY }}
      - name: Synchronisation des projets natifs
        run: npm run cap:sync
      - name: Version de Xcode
        # Capacitor 8 exige Xcode 26 ; on prend la plus récente installée sur l'image.
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          echo "Xcode : $XCODE"
          sudo xcode-select -s "$XCODE"
      - name: Numéro de version
        id: version
        run: node scripts/version-ios.mjs >> "$GITHUB_OUTPUT"
      - name: Certificat et profil de signature
        run: |
          KEYCHAIN="$RUNNER_TEMP/leurio-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            echo "PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
            echo "TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          } >> "$GITHUB_ENV"
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      - name: Archive signée
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Leurio.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$VERSION_NAME"
        env:
          # Passés par l'environnement, jamais collés dans le script (nom de balise).
          BUILD_NUMBER: ${{ steps.version.outputs.buildNumber }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
      - name: Export du .ipa
        run: |
          BUNDLE_ID="$(sed -n 's/.*PRODUCT_BUNDLE_IDENTIFIER = \(.*\);/\1/p' ios/App/App.xcodeproj/project.pbxproj | head -n 1)"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Leurio.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          cp "$RUNNER_TEMP/export/App.ipa" "$RUNNER_TEMP/Leurio.ipa"
      - name: .ipa en artefact
        uses: actions/upload-artifact@v4
        with:
          name: leurio-release-ipa
          path: ${{ runner.temp }}/Leurio.ipa
          if-no-files-found: error
      - name: Envoi sur TestFlight
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          # La clé .p8 est acceptée en texte brut ou en base64.
          if printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_FILE"
          else
            printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode > "$KEY_FILE"
          fi
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/Leurio.ipa" --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
