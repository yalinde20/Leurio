# CI du projet (PLAN §10) : installation, lint, type check, tests et build,
# avec les commandes de la section « ## Commands » de CLAUDE.md.
# Une pull request en échec ne doit pas pouvoir être fusionnée : rendre le check
# « CI / check » obligatoire dans la protection de la branche main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installation
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
