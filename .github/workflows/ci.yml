name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Cockpit could not tell how this project is built. Replace this step with its commands:
      # install, lint, type check, tests.
      - name: Checks
        run: echo "No check is configured yet. Edit .github/workflows/ci.yml."
